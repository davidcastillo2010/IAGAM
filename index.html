<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080D1B">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>IAGAM - Inteligencia que busca contigo</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080D1B;
 color:#edf5ff;
 min-height:100vh;
 display:flex;
 flex-direction:column
}
header{
 padding:19px;
 text-align:center;
 border-bottom:1px solid #23344f;
 background:#0d1629
}
.logo{
 font-size:29px;
 font-weight:bold;
 color:#42d9ff;
 letter-spacing:3px
}
header p{
 color:#9aacc5;
 font-size:13px;
 margin:7px 0 0
}
main{
 width:100%;
 max-width:850px;
 margin:auto;
 padding:20px;
 flex:1;
 display:flex;
 flex-direction:column
}
.welcome{
 text-align:center;
 margin:35px 0 22px
}
.welcome h1{
 font-size:25px;
 color:#fff
}
.welcome p{
 color:#9aacc5;
 line-height:1.6
}
#chat{
 display:flex;
 flex-direction:column;
 gap:16px;
 padding-bottom:20px
}
.message{
 padding:15px;
 border-radius:15px;
 line-height:1.6;
 white-space:pre-wrap;
 overflow-wrap:anywhere
}
.user{
 background:#173b60;
 align-self:flex-end;
 max-width:90%;
 border:1px solid #2674a9
}
.bot{
 background:#111e33;
 border:1px solid #263c5b;
 align-self:stretch
}
.sources{
 margin-top:12px;
 border-top:1px solid #30415a;
 padding-top:10px
}
.sources strong{color:#43d8ff}
.sources a{
 color:#55d9ff;
 display:block;
 margin:8px 0;
 overflow-wrap:anywhere
}
#status{
 color:#9aacc5;
 font-size:13px;
 padding:8px
}
form{
 position:sticky;
 bottom:0;
 background:#080D1B;
 padding:12px 0 18px;
 display:flex;
 gap:9px
}
textarea{
 flex:1;
 min-width:0;
 min-height:54px;
 max-height:140px;
 resize:vertical;
 padding:16px;
 border-radius:14px;
 border:1px solid #315174;
 background:#111e33;
 color:white;
 font-size:16px;
 outline:none
}
textarea:focus{border-color:#42d9ff}
button{
 border:0;
 border-radius:13px;
 padding:0 19px;
 background:#12a9d5;
 color:white;
 font-size:15px;
 font-weight:bold;
 cursor:pointer
}
button:disabled{opacity:.5}
.examples{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 justify-content:center;
 margin-bottom:20px
}
.examples button{
 background:#142640;
 border:1px solid #294765;
 padding:10px;
 font-size:12px
}
footer{
 text-align:center;
 padding:13px;
 color:#647c99;
 font-size:11px
}
</style>
</head>

<body>

<header>
 <div class="logo">IAGAM</div>
 <p>Inteligencia que busca contigo</p>
</header>

<main>

<section class="welcome" id="welcome">
 <h1>¿Qué quieres descubrir?</h1>
 <p>
  Pregunta, investiga, aprende o solicita un resumen.
  <br>
  IAGAM buscará información y te mostrará sus fuentes.
 </p>
</section>

<div class="examples" id="examples">
 <button type="button" onclick="example('¿Para qué sirve el oxígeno?')">
  ¿Para qué sirve el oxígeno?
 </button>

 <button type="button" onclick="example('Explícame qué es la inteligencia artificial con palabras sencillas')">
  ¿Qué es la IA?
 </button>

 <button type="button" onclick="example('Hazme un resumen sobre el sistema solar')">
  Resumir el sistema solar
 </button>
</div>

<section id="chat" aria-live="polite"></section>
<div id="status"></div>

<form id="form">
 <textarea
  id="question"
  placeholder="Escribe tu pregunta..."
  rows="1"
  required
 ></textarea>
 <button id="send" type="submit">Enviar</button>
</form>

</main>

<footer>
 IAGAM · Información consultada en fuentes abiertas
</footer>

<script>
const chat=document.getElementById("chat");
const form=document.getElementById("form");
const input=document.getElementById("question");
const send=document.getElementById("send");
const statusBox=document.getElementById("status");

const stopWords=new Set([
 "que","para","con","por","una","uno","unos","unas",
 "del","las","los","como","sobre","desde","entre",
 "tambien","este","esta","estos","estas","puede",
 "pueden","ser","son","fue","han","hay","sus","mas",
 "muy","cuando","donde","cual","quien","porque",
 "todo","toda","todos","todas","hazme","haz","resumen",
 "resume","resumir","resumeme","explicame","explica",
 "dime","quiero","saber","informacion","información",
 "tema","favor","por"
]);

function normalize(text){
 return text.toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9\s]/g," ")
  .replace(/\s+/g," ")
  .trim();
}

function getWords(text){
 return normalize(text)
  .split(" ")
  .filter(word=>word.length>2&&!stopWords.has(word));
}

function cleanQuery(text){
 let query=text.trim();

 query=query.replace(/[¿?¡!«»“”"]/g," ");

 query=query.replace(
  /^(hola[, ]*|por favor[, ]*)/i,
  ""
 );

 query=query.replace(
  /^(hazme|haz|dame|quiero|necesito)\s+(un\s+)?(resumen|resumir)\s+(sobre|de|del|acerca de)\s+/i,
  ""
 );

 query=query.replace(
  /^(resumen|resumir)\s+(sobre|de|del|acerca de)\s+/i,
  ""
 );

 query=query.replace(
  /^(explícame|explicame|explica|dime|cuéntame|cuentame|háblame de|hablame de)\s+/i,
  ""
 );

 query=query.replace(
  /^(qué es|que es|quién fue|quien fue|quién es|quien es|para qué sirve|para que sirve|cómo funciona|como funciona)\s+/i,
  ""
 );

 query=query.replace(
  /\s+(con palabras sencillas|en palabras sencillas|de forma sencilla|con ejemplos|por favor)$/i,
  ""
 );

 return query.replace(/\s+/g," ").trim();
}

function wantsSummary(text){
 return /resumen|resume|resumir|resúmeme|sintetiza/i.test(text);
}

function wantsSimple(text){
 return /sencill|fácil|facil|simple|niños|ninos/i.test(text);
}

function example(text){
 input.value=text;
 form.requestSubmit();
}

function addMessage(text,type,sources=[]){
 const box=document.createElement("div");
 box.className="message "+type;

 const body=document.createElement("div");
 body.textContent=text;
 box.appendChild(body);

 if(sources.length){
  const area=document.createElement("div");
  area.className="sources";

  const title=document.createElement("strong");
  title.textContent="Fuentes consultadas:";
  area.appendChild(title);

  sources.forEach(source=>{
   const link=document.createElement("a");
   link.href=source.url;
   link.target="_blank";
   link.rel="noopener noreferrer";
   link.textContent=source.title;
   area.appendChild(link);
  });

  box.appendChild(area);
 }

 chat.appendChild(box);
 box.scrollIntoView({behavior:"smooth",block:"end"});
}

function relevanceScore(queryWords,title,snippet=""){
 const titleWords=new Set(getWords(title));
 const snippetWords=new Set(getWords(snippet));

 let score=0;
 let matched=0;

 queryWords.forEach(word=>{
  let found=false;

  if(titleWords.has(word)){
   score+=5;
   found=true;
  }else if(
   [...titleWords].some(w=>
    w.startsWith(word)||word.startsWith(w)
   )
  ){
   score+=3;
   found=true;
  }

  if(!found&&snippetWords.has(word)){
   score+=1;
   found=true;
  }

  if(found)matched++;
 });

 return {
  score,
  matched,
  ratio:queryWords.length?matched/queryWords.length:0
 };
}

async function searchWikipedia(query){
 const params=new URLSearchParams({
  action:"query",
  list:"search",
  srsearch:query,
  srlimit:"10",
  format:"json",
  origin:"*"
 });

 const response=await fetch(
  "https://es.wikipedia.org/w/api.php?"+params
 );

 if(!response.ok){
  throw new Error("Error al buscar en Wikipedia");
 }

 const data=await response.json();
 return data.query?.search||[];
}

async function getArticle(pageid){
 const params=new URLSearchParams({
  action:"query",
  pageids:String(pageid),
  prop:"extracts",
  explaintext:"1",
  exintro:"1",
  exchars:"3500",
  format:"json",
  origin:"*"
 });

 const response=await fetch(
  "https://es.wikipedia.org/w/api.php?"+params
 );

 if(!response.ok){
  throw new Error("No se pudo cargar el artículo");
 }

 const data=await response.json();
 const page=data.query?.pages?.[pageid];

 if(!page||!page.extract)return null;

 return {
  title:page.title,
  extract:page.extract,
  url:"https://es.wikipedia.org/?curid="+pageid
 };
}

function articleMatches(queryWords,article){
 const result=relevanceScore(
  queryWords,
  article.title,
  article.extract.slice(0,1200)
 );

 if(queryWords.length===1){
  return result.matched>=1;
 }

 return result.ratio>=0.5;
}

function splitSentences(text){
 return text.replace(/\s+/g," ")
  .split(/(?<=[.!?])\s+/)
  .map(sentence=>sentence.trim())
  .filter(sentence=>
   sentence.length>45&&sentence.length<450
  );
}

function makeAnswer(original,article){
 const summary=wantsSummary(original);
 const simple=wantsSimple(original);

 const queryWords=getWords(cleanQuery(original));

 const sentences=splitSentences(article.extract);

 if(!sentences.length){
  return "Encontré el artículo, pero no pude organizar sus ideas. Puedes consultar la fuente completa.";
 }

 const ranked=sentences.map((sentence,index)=>{
  const words=new Set(getWords(sentence));
  let score=0;

  queryWords.forEach(word=>{
   if(words.has(word)){
    score+=3;
   }
  });

  score+=Math.max(0,1-index*0.08);

  if(sentence.length<150)score+=0.4;

  return {sentence,index,score,words};
 }).sort((a,b)=>b.score-a.score);

 const selected=[];

 for(const item of ranked){
  const duplicate=selected.some(old=>{
   const common=[...item.words].filter(
    word=>old.words.has(word)
   ).length;

   const smaller=Math.min(
    item.words.size,
    old.words.size
   )||1;

   return common/smaller>0.7;
  });

  if(!duplicate)selected.push(item);

  if(selected.length>=(summary?3:4))break;
 }

 selected.sort((a,b)=>a.index-b.index);

 let answer=summary
  ?"Resumen de las ideas principales: "
  :simple
  ?"Explicación sencilla basada en la fuente: "
  :"Información encontrada: ";

 answer+=article.title+"\n\n";

 selected.forEach((item,index)=>{
  let sentence=item.sentence;

  if(simple){
   sentence=sentence
    .replace(/\b(utiliza|emplea|mediante)\b/gi,"usa")
    .replace(/\bdenominado\b/gi,"llamado")
    .replace(/\bconstituye\b/gi,"es");
  }

  answer+=(summary?"• ":(index+1)+". ");
  answer+=sentence+"\n\n";
 });

 answer+="\nEste contenido está organizado a partir de la fuente consultada. Puede omitir detalles.";

 return answer.trim();
}

async function ask(question){
 document.getElementById("welcome").style.display="none";
 document.getElementById("examples").style.display="none";

 addMessage(question,"user");

 send.disabled=true;
 statusBox.textContent="Analizando tu pregunta...";

 try{
  const query=cleanQuery(question);
  const queryWords=getWords(query);

  if(!query||!queryWords.length){
   addMessage(
    "Escribe un tema más específico para poder buscar información.",
    "bot"
   );
   return;
  }

  statusBox.textContent="Buscando resultados relacionados...";

  const results=await searchWikipedia(query);

  if(!results.length){
   addMessage(
    "No encontré información para ese tema. Intenta expresarlo con otras palabras.",
    "bot"
   );
   return;
  }

  const candidates=results.map(item=>{
   const relevance=relevanceScore(
    queryWords,
    item.title,
    item.snippet||""
   );

   return {...item,relevance};
  })
  .filter(item=>{
   if(queryWords.length===1){
    return item.relevance.matched>=1;
   }

   return item.relevance.ratio>=0.5;
  })
  .sort((a,b)=>
   b.relevance.score-a.relevance.score
  );

  if(!candidates.length){
   addMessage(
    "Encontré resultados, pero no pude confirmar que correspondan a tu pregunta. Prueba con un tema más específico.",
    "bot"
   );
   return;
  }

  statusBox.textContent="Comprobando los artículos encontrados...";

  const articles=await Promise.all(
   candidates.slice(0,5).map(item=>
    getArticle(item.pageid)
   )
  );

  const relevant=articles
   .filter(article=>
    article&&articleMatches(queryWords,article)
   );

  if(!relevant.length){
   addMessage(
    "No encontré un artículo suficientemente relacionado con tu pregunta. No quiero darte información equivocada. Intenta escribirla de otra manera.",
    "bot"
   );
   return;
  }

  const best=relevant[0];

  addMessage(
   makeAnswer(question,best),
   "bot",
   relevant.slice(0,3).map(article=>({
    title:article.title,
    url:article.url
   }))
  );

 }catch(error){
  addMessage(
   "No pude consultar las fuentes en este momento. Comprueba tu conexión e inténtalo de nuevo.",
   "bot"
  );

 }finally{
  statusBox.textContent="";
  send.disabled=false;
  input.focus();
 }
}

form.addEventListener("submit",event=>{
 event.preventDefault();

 const question=input.value.trim();

 if(!question)return;

 input.value="";
 ask(question);
});

input.addEventListener("keydown",event=>{
 if(event.key==="Enter"&&!event.shiftKey){
  event.preventDefault();
  form.requestSubmit();
 }
});

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js")
   .catch(error=>console.log("Service Worker:",error));
 });
}
</script>

</body>
</html>
